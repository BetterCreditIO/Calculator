<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'" />
    <title>GoodBoyPdf</title>
  </head>
  <body>
    <!-- Prevent flash-of-wrong-theme: apply persisted theme before React mounts. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("goodboy-theme");
          var theme = stored ? JSON.parse(stored).state.theme : "system";
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* default to dark (already set on <html>) */
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
